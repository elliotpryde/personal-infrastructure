version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: terraform
    directories:
      - /Terraform
      - /Terraform/elliotpryde.com
    schedule:
      interval: weekly

  - package-ecosystem: gomod
    directories:
      - /tools/*
    schedule:
      interval: weekly
    groups:
      aws:
        patterns:
          - "github.com/aws/*"
